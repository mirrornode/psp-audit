name: Canon Gate
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
jobs:
  canon-gate:
    name: Contract Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Canon Gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/canon_gate.py
      - name: Run bounded regression tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_forward_finder.py' -v
          python -m unittest discover -s tests -p 'test_canon_gate.py' -v
